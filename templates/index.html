<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Back To The Future</title>
</head>
<body>

    <div id="app">
        <h1>Back To The Future</h1>
        <div id="form-movies">
            {% if error %}
                <p class="error">{{ error }}</p>
            {% endif %}
            <form method="POST">
                <p>
                    <textarea name="movies_input" placeholder="Entrer les titres des films (un par ligne)"></textarea>
                </p>
                <p>
                    <button type="submit">Valider</button>
                </p>
            </form>
        </div>

        <div id="result">
        {% if total_price %}
            <table>
                <thead>
                    <tr>
                        <th>Titre du film</th>
                        <th>Prix (€)</th>
                    </tr>
                </thead>
                <tbody>
                    {% for movie in movies %}
                    <tr>
                        <td>{{ movie.title }}</td>
                        <td>{{ movie.price }}</td>
                    </tr>
                    {% endfor %}
                    <tr>
                        <td><strong>Total</strong></td>
                        <td><strong>{{ total_price }}</strong></td>
                    </tr>
                </tbody>
            </table>
        {% endif %}
        </div>
    </div>





    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
        }
        #app {
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
            background-color: #fff;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        h1 {
            text-align: center;
            color: #333;
        }
        #form-movies {
            margin: 20px auto;
            text-align: center;
        }
        #form-movies textarea {
            width: 80%;
            height: 100px;
            padding: 10px;
            margin-bottom: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        #result table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        #result th, #result td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: left;
        }
        #result th {
            background-color: #f2f2f2;
        }

        .error {
            color: red;
            font-weight: bold;
        }
    </style>

</body>
</html>
